# 로컬 커밋 전 훅(.githooks/pre-commit)은 켜야 동작한다.
# 같은 검사와 레시피 테스트를 푸시·PR마다 서버에서도 돌려, 규칙 위반이 조용히 들어오지 않게 한다.
name: integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 무결성 검사 (스키마 드리프트 · MANIFEST · 오버레이 · data 비추적)
        run: python method/recipes/check_integrity.py
      - name: 기준 레시피 단위 테스트 (관측 계약 · 기록 · 사후 검증 · 입력 문서 · 채점 · 유사 사례)
        run: python -m unittest discover -s tests -v
